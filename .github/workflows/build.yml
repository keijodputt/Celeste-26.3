name: Build and Release Celeste

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Generate UTC timestamp
        id: timestamp
        run: echo "build_tag=$(date -u +'%Y%m%dT%H%M%SZ')" >> $GITHUB_OUTPUT

      - name: Package final artifact
        id: package_jar
        run: |
          RAW_JAR=$(find target dist -maxdepth 1 -name "*.jar" ! -name "original-*.jar" 2>/dev/null | head -n 1)
          if [ -z "$RAW_JAR" ]; then
            echo "Error: no generated jar found in target or dist directories." >&2
            exit 1
          fi
          FINAL_NAME="Celeste-26.3-${{ steps.timestamp.outputs.build_tag }}.jar"
          cp "$RAW_JAR" "target/$FINAL_NAME"
          echo "jar_path=target/$FINAL_NAME" >> $GITHUB_OUTPUT
          echo "jar_name=$FINAL_NAME" >> $GITHUB_OUTPUT
          echo "Prepared release artifact: target/$FINAL_NAME"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 26.3-${{ steps.timestamp.outputs.build_tag }}
          name: Celeste 26.3 (${{ steps.timestamp.outputs.build_tag }})
          body: |
            Automated build for Purpur / Paper 26.3.
            Artifact: ${{ steps.package_jar.outputs.jar_name }}
            Commit: ${{ github.sha }}
          files: ${{ steps.package_jar.outputs.jar_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
