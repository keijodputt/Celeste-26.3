name: Build and Release Celeste

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Locate Artifact
        id: find_jar
        run: |
          JAR_PATH=$(find target dist -maxdepth 1 -name "*.jar" ! -name "original-*.jar" 2>/dev/null | head -n 1)
          if [ -z "$JAR_PATH" ]; then
            echo "No jar file was found." >&2
            exit 1
          fi
          echo "jar_file=$JAR_PATH" >> $GITHUB_OUTPUT
          echo "JAR found: $JAR_PATH"

      - name: Generate timestamp
        id: timestamp
        run: echo "build_tag=$(date -u +'%y%m%dT%H%M%SZ')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 26.3-${{ steps.timestamp.outputs.build_tag }}
          name: Celeste 26.3 (${{ steps.timestamp.outputs.build_tag }})
          body: |
            Celeste autocompile for Purpur / Paper 26.3.
            Timestamp UTC: ${{ steps.timestamp.outputs.build_tag }}
            Commit: ${{ github.sha }}
          files: ${{ steps.find_jar.outputs.jar_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
