name: Build and Release Celeste

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
        cache: 'maven'

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Locate Artifact
      id: find_jar
      run: |
        JAR_PATH=$(find target dist -maxdepth 1 -name "*.jar" ! -name "original-*.jar" 2>/dev/null | head -n 1)
        if [ -z "$JAR_PATH" ]; then
          echo "No se encontro ningun archivo jar." >&2
          exit 1
        fi
        echo "jar_file=$JAR_PATH" >> $GITHUB_OUTPUT
        echo "JAR encontrado: $JAR_PATH"

    - name: Upload Artifact to Run
      uses: actions/upload-artifact@v4
      with:
        name: Celeste-26.3-build
        path: ${{ steps.find_jar.outputs.jar_file }}

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v26.3-build-${{ github.run_number }}
        name: Celeste 26.3 (Build #${{ github.run_number }})
        body: |
          Compilacion automatica de Celeste para Purpur / Paper 26.3.
          Generado desde el commit ${{ github.sha }}.
        files: ${{ steps.find_jar.outputs.jar_file }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
